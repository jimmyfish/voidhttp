<header class="pv-bar">

    <button type="button" data-screen="menu" aria-pressed="false">Menu open</button>
    <button type="button" data-screen="grpc" aria-pressed="false">gRPC only</button>
    <button type="button" data-screen="none" aria-pressed="false">No matches</button>
  </nav>
  <div class="pv-theme" role="group" aria-label="Active filter shown as">
    <button type="button" data-variant="a" aria-pressed="true">A · Button</button>
    <button type="button" data-variant="b" aria-pressed="false">B · Button + pills</button>
  </div>
  <div class="pv-theme" role="group" aria-label="Theme" style="margin-left:0">
    <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
</header>

<div class="pv-stage">
<div class="app">
  <div class="app-strip" data-tauri-drag-region>
    <nav class="ptabs" aria-label="Projects">
      <button type="button" class="ptab"><svg aria-hidden="true" class="ico"><use href="#i-house"/></svg>Home</button>
      <span class="ptab-sep" aria-hidden="true"></span>
      <div class="ptab ptab--project" aria-current="page">
        <button type="button" class="ptab-main"><span class="proj-tile proj-tile--sm" style="--fg: var(--proj-1-fg); --bg: var(--proj-1-bg)"><svg aria-hidden="true" class="ico"><use href="#i-landmark"/></svg></span>Amarbank</button>
        <button type="button" class="icon-btn ptab-close" aria-label="Close Amarbank"><svg aria-hidden="true" class="ico"><use href="#i-x"/></svg></button>
      </div>
    </nav>
    <button type="button" class="icon-btn strip-settings" title="Settings  ⌘," aria-label="Settings"><svg aria-hidden="true" class="ico"><use href="#i-settings"/></svg></button>
  </div>
  <nav class="rail" aria-label="Sections">
    <div class="rail-mark" aria-hidden="true">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke-width="2" style="stroke: var(--color-accent)"/><circle cx="8" cy="8" r="2.25" fill="none" stroke-width="1.5" style="stroke: var(--color-ok)"/></svg>
    </div>
    <button type="button" class="rail-item" aria-label="Collections" title="Collections"><svg aria-hidden="true" class="ico ico-lg"><use href="#i-layers"/></svg></button>
    <button type="button" class="rail-item" aria-label="History" title="History" aria-current="page"><svg aria-hidden="true" class="ico ico-lg"><use href="#i-history"/></svg></button>
    <button type="button" class="rail-item" aria-label="Variables" title="Variables"><svg aria-hidden="true" class="ico ico-lg"><use href="#i-braces"/></svg></button>
  </nav>

  <div class="panel">
    <!-- ===== sidebar: history, with the method filter beside the search ===== -->
    <aside class="sidebar">
      <div class="side-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
      <div class="side-head"><h2>History</h2><button type="button" class="btn">Clear</button></div>
      <div class="side-tools">
        <div class="search"><svg aria-hidden="true" class="ico"><use href="#i-search"/></svg><input class="field" placeholder="Search" aria-label="Search history" data-q></div>
        <div class="hf-wrap">
          <button type="button" class="icon-btn icon-btn--outline" title="Filter by method" aria-label="Filter by method" aria-haspopup="menu" aria-expanded="false" aria-pressed="false" data-hf-btn><svg aria-hidden="true" class="ico"><use href="#i-list-filter"/></svg></button>
          <div class="menu ev-menu hf-menu" role="menu" aria-label="Filter by method" hidden data-hf-menu></div>
        </div>
      </div>
      <div class="hf-chips" hidden data-chips></div>
      <div class="tree" data-tree></div>
    </aside>

    <!-- ===== work area: not part of this change ===== -->
    <main class="work">
      <div class="tabsbar">
        <button type="button" class="icon-btn side-toggle" aria-label="Hide sidebar" title="Hide sidebar  ⌘\"><svg aria-hidden="true" class="ico"><use href="#i-panel-left-close"/></svg></button>
        <div class="tabs"></div>
      </div>
      <div class="empty"><strong>History method filter</strong><span>Only the sidebar changes in this preview.</span></div>
    </main>
  </div>
</div>
</div>

<script>
  // stand-in for local history (newest first); labels as the sidebar shows them
  const H = [
    ["GRPC", "AuthService/Login", "13:59", "OK", 1], ["GRPC", "AuthService/Login", "13:59", "OK", 1],
    ["GET", "api.example.com/v1/customers", "13:57", "200", 1], ["POST", "api.example.com/v1/customers", "13:55", "201", 1],
    ["GRPC", "AuthService/IntrospectToken", "13:52", "OK", 1], ["GQL", "api.example.com/graphql", "13:52", "200", 1],
    ["GRPC", "AuthService/RetrospectToken", "13:51", "16", 0], ["DELETE", "api.example.com/v1/customers/cus_8f2c41", "13:50", "404", 0],
    ["WS", "echo.example.com/socket", "13:49", "101", 1], ["GRPC", "AuthService/Login", "13:48", "OK", 1],
    ["POST", "auth.example.com/realms/demo/token", "13:47", "401", 0], ["GET", "api.example.com/v1/invoices", "13:45", "200", 1],
  ];
  const LABEL = { GRPC: "gRPC", DELETE: "DEL", GQL: "GQL", WS: "WS" };
  const lbl = (m) => LABEL[m] ?? m;
  const ORDER = ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS", "GQL", "GRPC", "WS", "SIO", "KAFKA", "MQTT", "PUBSUB"];
  const ico = (id) => `<svg aria-hidden="true" class="ico"><use href="#i-${id}"/></svg>`;
  const $ = (s) => document.querySelector(s);
  const btn = $("[data-hf-btn]"), menu = $("[data-hf-menu]"), tree = $("[data-tree]"), chips = $("[data-chips]"), q = $("[data-q]");
  let only = new Set(), variant = "a";

  const counts = () => { const c = {}; for (const [m] of H) c[m] = (c[m] ?? 0) + 1; return ORDER.filter((m) => c[m]).map((m) => [m, c[m]]); };

  function render() {
    const f = q.value.trim().toLowerCase();
    const items = H.filter(([m, name]) => (!only.size || only.has(m)) && (!f || `${name} ${lbl(m)}`.toLowerCase().includes(f)));
    tree.innerHTML = items.length
      ? `<div class="day">Today</div>` + items.map(([m, name, t, s, ok]) =>
          `<div class="row"><button type="button" class="row-main"><span class="m m-${m}">${lbl(m)}</span><span class="name">${name}</span><span class="htime">${t}</span><span class="hstatus ${ok ? "ok" : "fail"}">${s}</span></button><button type="button" class="icon-btn row-more" aria-label="More actions" title="More actions">${ico("ellipsis")}</button></div>`).join("")
      : `<div class="empty"><strong>No matches</strong>${only.size ? `<span class="empty-actions"><button type="button" class="link" data-clear>Show all methods</button></span>` : ""}</div>`;
    tree.querySelector("[data-clear]")?.addEventListener("click", () => { only.clear(); render(); });

    btn.setAttribute("aria-pressed", String(only.size > 0));
    btn.title = only.size ? `Filter by method: ${[...only].map(lbl).join(", ")}` : "Filter by method";

    chips.hidden = variant !== "b" || !only.size;
    chips.innerHTML = [...only].map((m) => `<button type="button" class="hf-chip" data-m="${m}" aria-label="Remove ${lbl(m)} filter" title="Remove"><span class="m m-${m}">${lbl(m)}</span>${ico("x")}</button>`).join("");
    chips.querySelectorAll("[data-m]").forEach((c) => c.addEventListener("click", () => { only.delete(c.dataset.m); render(); }));

    menu.innerHTML =
      `<button type="button" role="menuitemradio" aria-checked="${!only.size}" data-all>${only.size ? `<span class="tick-gap"></span>` : ico("check")}<span>All methods</span><span class="cnt">${H.length}</span></button><hr>` +
      counts().map(([m, n]) => `<button type="button" role="menuitemcheckbox" aria-checked="${only.has(m)}" data-m="${m}">${only.has(m) ? ico("check") : `<span class="tick-gap"></span>`}<span class="m m-${m}">${lbl(m)}</span><span class="cnt">${n}</span></button>`).join("");
    menu.querySelector("[data-all]").addEventListener("click", () => { only.clear(); render(); menu.querySelector("[data-all]").focus(); });
    menu.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => {
      const m = b.dataset.m; only.has(m) ? only.delete(m) : only.add(m); render(); menu.querySelector(`[data-m="${m}"]`).focus();
    }));
  }

  const show = (on) => { menu.hidden = !on; btn.setAttribute("aria-expanded", String(on)); };
  btn.addEventListener("click", () => show(menu.hidden));
  menu.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { show(false); btn.focus(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const all = [...menu.querySelectorAll("button")]; const i = all.indexOf(document.activeElement);
      all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus(); e.preventDefault();
    }
  });
  document.addEventListener("mousedown", (e) => { if (!menu.hidden && !e.target.closest(".hf-wrap")) show(false); });
  q.addEventListener("input", render);

  const screens = {
    all: () => { only.clear(); q.value = ""; show(false); },
    menu: () => { only = new Set(["GRPC"]); q.value = ""; show(true); },
    grpc: () => { only = new Set(["GRPC"]); q.value = ""; show(false); },
    none: () => { only = new Set(["WS"]); q.value = "Login"; show(false); },
  };
  const setScreen = (s) => {
    screens[s](); render();
    document.querySelectorAll("[data-screen]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.screen === s)));
  };
  document.querySelectorAll("[data-screen]").forEach((b) => b.addEventListener("click", () => setScreen(b.dataset.screen)));
  document.querySelectorAll("[data-variant]").forEach((b) => b.addEventListener("click", () => {
    variant = b.dataset.variant; render();
    document.querySelectorAll("[data-variant]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));

  const setTheme = (t) => {
    document.documentElement.dataset.theme = t;
    document.querySelectorAll("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.themeSet === t)));
  };
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  setTheme(new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light");
  setScreen((location.hash.slice(1) in screens) ? location.hash.slice(1) : "all");
</script>
</body>
</html>
