<script>
  // Theme: Auto/Light/Dark plus a colour scheme per appearance. The bar's Light/Dark stands in for the Mac's appearance.
  {
    const { SCHEMES, tokens, isDark, swatch } = window.VoidThemes;
    const BUILTIN = { "void-light": ["#ffffff", "#01804a", "#c74200", "#2e67e5", "#d00000"], "void-dark": ["#161b25", "#01bf71", "#ff7a33", "#4f85fc", "#ff5c5c"] };
    const q = new URLSearchParams(location.search);
    const st = { mode: q.get("mode") || "auto", light: q.get("light") || "void-light", dark: q.get("dark") || "void-dark", os: "light" };
    const opts = `<optgroup label="voidHTTP"><option value="void-light">voidHTTP Light</option><option value="void-dark">voidHTTP Dark</option></optgroup>` +
      [...new Set(SCHEMES.map((x) => x.family))].map((f) => `<optgroup label="${f}">${SCHEMES.filter((x) => x.family === f).map((x) => `<option value="${x.id}">${x.name}</option>`).join("")}</optgroup>`).join("");
    const sels = document.querySelectorAll("[data-scheme]");
    sels.forEach((sel) => { sel.innerHTML = opts; sel.addEventListener("change", () => { st[sel.dataset.scheme === "one" ? st.mode : sel.dataset.scheme] = sel.value; apply(); }); });
    const dotsFor = (id) => BUILTIN[id] || swatch(SCHEMES.find((x) => x.id === id));
    let set = [];
    function apply() {
      const root = document.documentElement;
      const look = st.mode === "auto" ? st.os : st.mode;
      const id = st[look];
      set.forEach((k) => root.style.removeProperty(k)); set = [];
      const sc = SCHEMES.find((x) => x.id === id);
      root.dataset.theme = sc ? (isDark(sc) ? "dark" : "light") : id === "void-dark" ? "dark" : "light";
      if (sc) Object.entries(tokens(sc)).forEach(([k, v]) => { root.style.setProperty(k, v); set.push(k); });
      // rows: both slots under Auto, one under Light or Dark
      const auto = st.mode === "auto";
      document.querySelectorAll("[data-scheme-row]").forEach((row) => {
        const slot = row.dataset.schemeRow;
        row.hidden = !auto && slot !== st.mode;
        if (row.hidden) return;
        const key = auto ? slot : st.mode;
        row.querySelector("[data-scheme-label]").textContent = auto ? (slot === "light" ? "Light theme" : "Dark theme") : "Color scheme";
        row.querySelector("[data-scheme-desc]").textContent = auto ? `Used while your Mac is ${slot}` : "Any scheme, light or dark";
        const sel = row.querySelector("select"); sel.value = st[key]; sel.dataset.scheme = auto ? slot : "one";
        const [bg, ...dots] = dotsFor(st[key]);
        const d = row.querySelector(".scheme-dots"); d.style.background = bg; d.innerHTML = dots.map((c) => `<i style="background:${c}"></i>`).join("");
      });
      document.querySelectorAll("[data-set-theme]").forEach((x) => x.setAttribute("aria-pressed", String((x.dataset.setTheme || "auto") === st.mode)));
      document.querySelectorAll("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.themeSet === st.os)));
    }
    document.querySelectorAll("[data-set-theme]").forEach((b) => b.addEventListener("click", () => { st.mode = b.dataset.setTheme || "auto"; apply(); }));
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => { st.os = b.dataset.themeSet; apply(); }));
    window.pvApply = apply;
    apply();
  }
  document.querySelectorAll("[data-font], [data-size]").forEach((sel) => sel.addEventListener("change", () => {
    const prop = sel.dataset.font || sel.dataset.size;
    if (sel.value) document.documentElement.style.setProperty(prop, sel.value); else document.documentElement.style.removeProperty(prop);
    if (sel.dataset.size) document.documentElement.style.setProperty("--font-size-code", sel.value ? `calc(${sel.value} - 1px)` : "");
  }));
  // Address bar: {{var}} and :param tokens painted on a layer behind a transparent-text input
  {
    const SCOPE = { baseUrl: ["https://api.amarbank.dev", "Staging"], pageSize: ["20", "Collection · trx-service"] };
    const TOKEN = /(\{\{\s*[^{}]+?\s*\}\})|((?<=\/):[A-Za-z_][\w-]*)|([?&=])/g;
    const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const scope = () => (SCOPE);
    const paint = (v) => {
      let out = "", last = 0, inQuery = false;
      for (const m of v.matchAll(TOKEN)) {
        out += esc(v.slice(last, m.index)); last = m.index + m[0].length;
        if (m[1]) {
          const name = m[1].slice(2, -2).trim();
          const ok = name in scope() || name.startsWith("$");
          out += `<span class="tok-var${ok ? "" : " is-missing"}" data-var="${esc(name)}"><i>{{</i>${esc(m[1].slice(2, -2))}<i>}}</i></span>`;
        } else if (m[2] && !inQuery) out += `<span class="tok-path" data-path="${esc(m[2].slice(1))}">${esc(m[2])}</span>`;
        else { if (m[3] === "?") inQuery = true; out += inQuery ? `<span class="tok-q">${esc(m[0])}</span>` : esc(m[0]); }
      }
      return out + esc(v.slice(last));
    };
    document.querySelectorAll('.url-field input[aria-label="URL"]').forEach((input) => {
      const wrap = document.createElement("div"); wrap.className = "url-input";
      if (input.hidden) wrap.dataset.mirrorHidden = "";
      input.replaceWith(wrap);
      const hl = document.createElement("div"); hl.className = "url-hl"; hl.setAttribute("aria-hidden", "true");
      wrap.append(hl, input);
      const tip = document.createElement("div"); tip.className = "url-tip"; tip.hidden = true; wrap.append(tip);
      const sync = () => { hl.innerHTML = `<span class="url-hl-in">${paint(input.value)} </span>`; hl.firstChild.style.transform = `translateX(${-input.scrollLeft}px)`; wrap.hidden = input.hidden; };
      ["input", "scroll", "keyup", "select", "focus"].forEach((ev) => input.addEventListener(ev, sync));
      new MutationObserver(sync).observe(input, { attributes: true, attributeFilter: ["hidden"] });
      sync();
      const show = (span) => {
        const s = scope();
        if (span.dataset.var) {
          const n = span.dataset.var, hit = s[n];
          tip.innerHTML = hit
            ? `<span class="tip-k">${esc(n)}</span><code>${esc(hit[0])}</code><span class="tip-src">${esc(hit[1])}</span>`
            : n.startsWith("$") ? `<span class="tip-k">${esc(n)}</span><span class="tip-src">Dynamic · new value on every send</span>`
            : `<span class="tip-k is-missing">${esc(n)}</span><span class="tip-src">Not defined in Staging or the collection</span><button type="button" class="tip-link">Add to Staging</button>`;
        } else {
          tip.innerHTML = `<span class="tip-k is-path">:${esc(span.dataset.path)}</span><span class="tip-src">Path variable · set it in Params</span>`;
        }
        const r = span.getBoundingClientRect(), w = wrap.getBoundingClientRect();
        tip.style.left = `${Math.max(0, r.left - w.left)}px`; tip.hidden = false;
      };
      let over = null;
      wrap.addEventListener("mousemove", (e) => {
        const span = [...hl.querySelectorAll(".tok-var, .tok-path")].find((x) => { const r = x.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4; });
        if (span === over) return; over = span;
        input.style.cursor = span ? "help" : "";
        if (span) show(span); else if (!tip.matches(":hover")) tip.hidden = true;
      });
      wrap.addEventListener("mouseleave", () => { over = null; tip.hidden = true; });
    });
  }
  // Layout: stacked or side by side; the bar buttons and the tabs-bar toggle both drive it
  {
    const app = document.querySelector(".pv-stage .app");
    const tgl = document.querySelector(".layout-toggle");
    const setLayout = (v) => {
      if (v) app.dataset.variant = v; else delete app.dataset.variant;
      document.querySelectorAll("[data-layout-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.layoutSet === (v || ""))));
      tgl.setAttribute("aria-label", v ? "Stacked" : "Side by side");
      tgl.title = v ? "Response below the request" : "Response beside the request";
      tgl.querySelector("use").setAttribute("href", v ? "#i-rows-2" : "#i-columns-2");
    };
    document.querySelectorAll("[data-layout-set]").forEach((b) => b.addEventListener("click", () => setLayout(b.dataset.layoutSet)));
    tgl.addEventListener("click", () => setLayout(app.dataset.variant ? "" : "split"));
    if (new URLSearchParams(location.search).get("layout") === "split" || /split/.test(location.hash)) setLayout("split");
  }
  // Method menu (shipped): our own menu in place of the native select
  {
    const btn = document.querySelector("[data-method-btn]");
    const menu = btn.nextElementSibling;
    const show = (on) => { menu.hidden = !on; btn.setAttribute("aria-expanded", String(on)); if (on) menu.querySelector('[aria-checked="true"]')?.focus(); };
    const set = (m) => {
      btn.textContent = m === "GRPC" ? "gRPC" : m; btn.className = `method-btn m-${m}`; btn.setAttribute("aria-label", `Method: ${m}`);
      menu.querySelectorAll("[data-method]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.method === m)));
      show(false);
    };
    btn.addEventListener("click", () => show(menu.hidden));
    menu.querySelectorAll("[data-method]").forEach((b) => b.addEventListener("click", () => set(b.dataset.method)));
    menu.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { show(false); btn.focus(); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const all = [...menu.querySelectorAll("button")]; const i = all.indexOf(document.activeElement);
        all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus(); e.preventDefault();
      }
    });
    document.addEventListener("mousedown", (e) => { if (!menu.hidden && !e.target.closest(".method-wrap")) show(false); });
    if (/method/.test(location.hash)) show(true);
  }
  // Environment menu (new): dot + name in both densities; our own menu with each environment's colour
  {
    const btn = document.querySelector("[data-env-btn]");
    const menu = document.querySelector(".env-menu");
    const show = (on) => { menu.hidden = !on; btn.setAttribute("aria-expanded", String(on)); if (on) menu.querySelector('[aria-checked="true"]')?.focus(); };
    const set = (b) => {
      const c = b.dataset.color, name = b.dataset.env ? b.querySelector(".env-name").textContent : "No environment";
      if (c) btn.style.setProperty("--env-c", `var(--tag-${c})`); else btn.style.removeProperty("--env-c");
      btn.querySelector(".env-dot").hidden = !c;
      btn.querySelector(".env-name").textContent = name; btn.setAttribute("aria-label", `Environment: ${name}`);
      menu.querySelectorAll("[data-env]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
      show(false); btn.focus();
    };
    btn.addEventListener("click", () => show(menu.hidden));
    menu.querySelectorAll("[data-env]").forEach((b) => b.addEventListener("click", () => set(b)));
    menu.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { show(false); btn.focus(); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const all = [...menu.querySelectorAll("button")]; const i = all.indexOf(document.activeElement);
        all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus(); e.preventDefault();
      }
    });
    document.addEventListener("mousedown", (e) => { if (!menu.hidden && !e.target.closest(".env-group")) show(false); });
    if (/env/.test(location.hash)) show(true);
  }
  // Compact mode (shipped): the bar's Default/Compact sets the same attribute on <html> as Settings does in the app
  {
    const root = document.documentElement;
    const setDensity = (d) => {
      if (d) root.dataset.density = d; else delete root.dataset.density;
      document.querySelectorAll("[data-density-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.densitySet === (d || ""))));
    };
    document.querySelectorAll("[data-density-set]").forEach((b) => b.addEventListener("click", () => setDensity(b.dataset.densitySet)));
    if (new URLSearchParams(location.search).get("density") === "compact" || /compact/.test(location.hash)) setDensity("compact");
  }
  if (new URLSearchParams(location.search).get("theme") === "dark") document.querySelector('[data-theme-set="dark"]').click();
</script>
<script>
  // Table view: the same rules the app will use, so the preview behaves like the real thing.
  // rows = the array (or object) at `path`; columns = every key, in order of first appearance;
  // a nested object or array is a chip that opens it as its own table; the trail walks back.
  {
    const BODY = {
      data: [
        { id: "cus_8f2c41", name: "Ada Lovelace", email: "ada@example.com", currency: "IDR", balance: 1250000, status: "active", delinquent: false, phone: "+62 812 0000 1111", address: { city: "Jakarta", country: "ID", postal: "12190" }, tags: ["vip", "payroll"], created_at: "2026-11-12T07:02:11Z" },
        { id: "cus_19c2a7", name: "Grace Hopper", email: "grace@example.com", currency: "USD", balance: 0, status: "active", delinquent: false, phone: null, address: { city: "Arlington", country: "US", postal: "22201" }, tags: [], created_at: "2026-11-10T14:40:52Z" },
        { id: "cus_4be019", name: "Alan Turing", email: "alan@example.com", currency: "IDR", balance: -84000, status: "frozen", delinquent: true, phone: null, address: { city: "Bandung", country: "ID", postal: "40115", line2: "Blok C 12" }, tags: ["review"], created_at: "2026-11-09T02:15:00Z" },
        { id: "cus_77d3e0", name: "Katherine Johnson", email: "", currency: "EUR", balance: 310500, status: "active", delinquent: false, address: { city: "Berlin", country: "DE", postal: "10115" }, tags: ["payroll"], created_at: "2026-11-08T09:30:12Z" },
        { id: "cus_0a91fd", name: "Edsger Dijkstra", email: "edsger@example.com", currency: "IDR", balance: 92000, status: "closed", delinquent: false, phone: "+62 811 2222 3333", address: null, tags: [], created_at: "2026-11-05T18:01:44Z" },
        { id: "cus_c5e822", name: "Barbara Liskov", email: "barbara@example.com", currency: "USD", balance: 0, status: "active", delinquent: false, address: { city: "Boston", country: "US", postal: "02115" }, tags: ["vip"], created_at: "2026-11-02T11:12:09Z" },
      ],
      meta: { total: 214, page: 1, per_page: 6, has_more: true },
      warnings: ["IDR balances are cached for 60 s"],
    };
    // the owner's example: rows whose hobbies are themselves rows, one level deeper for Dito's gear
    const DEEP = {
      message: "success",
      data: [
        { name: "Dito", age: 24, hobbies: [{ key: "fishing", value: "Memancing", gear: [{ item: "rod", qty: 2 }, { item: "reel", qty: 1 }] }, { key: "cycling", value: "Bersepeda" }] },
        { name: "Afif", age: 30, hobbies: [{ key: "cooking", value: "Memasak" }, { key: "reading", value: "Membaca" }] },
        { name: "Sari", age: 27, hobbies: [{ key: "hiking", value: "Mendaki", gear: [{ item: "boots", qty: 1 }] }] },
      ],
    };
    const XML = `<?xml version="1.0" encoding="UTF-8"?>\n<customers total="214">\n  <customer id="cus_8f2c41">\n    <name>Ada Lovelace</name>\n    <currency>IDR</currency>\n  </customer>\n</customers>`;

    const SCREENS = {
      table: { path: ["data"], sort: { col: "balance", dir: "desc" } },
      pick: { path: ["data"], sort: { col: "balance", dir: "desc" }, menu: true },
      drill: { path: ["data", 2, "address"] },
      deep: { deep: true, path: ["data"], open: ['["data",0,"hobbies"]', '["data",0,"hobbies",0,"gear"]', '["data",1,"hobbies"]'] },
      fanout: { deep: true, path: ["data", "*", "hobbies"], menu: true },
      root: { path: [] },
      search: { path: ["data"], q: "IDR" },
      path: { path: ["data"], q: "$.data[?(@.balance > 0)]" },
      notjson: {},
    };

    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
    const at = (root, path) => path.reduce((v, k) => (v == null ? v : v[k]), root);
    const ico = (id) => `<svg aria-hidden="true" class="ico"><use href="#i-${id}"/></svg>`;
    const kind = (v) => (v === null ? "null" : Array.isArray(v) ? "array" : typeof v);
    const crumb = (k) => (k === "*" ? "[*]" : typeof k === "number" ? `[${k}]` : k);

    /** every array or object the rows can come from; arrays of objects also offer `[*].key`: that key from every row, in one table */
    function candidates(root) {
      const out = [];
      const walk = (v, path) => {
        if (Array.isArray(v)) {
          out.push({ path, what: v.length === 1 ? "1 row" : `${v.length} rows` });
          const objs = v.filter(isObj);
          const keys = [...new Set(objs.flatMap((o) => Object.keys(o)))];
          keys.forEach((k) => {
            const all = objs.flatMap((o) => (Array.isArray(o[k]) ? o[k] : []));
            if (all.length && all.some(isObj)) walk(all, [...path, "*", k]);
          });
        } else if (isObj(v)) {
          const n = Object.keys(v).length;
          out.push({ path, what: n === 1 ? "1 field" : `${n} fields` });
          Object.entries(v).forEach(([k, x]) => walk(x, [...path, k]));
        }
      };
      walk(root, []);
      return out;
    }
    const jp = (path) => "$" + path.map((k) => (k === "*" ? "[*]" : typeof k === "number" ? `[${k}]` : `.${k}`)).join("");

    /** rows at a path; each `*` fans out, and every row remembers the indexes it came through */
    function rowsAt(root, path) {
      let cur = [{ v: root, from: [] }];
      for (const k of path) {
        cur = k === "*"
          ? cur.flatMap((c) => (Array.isArray(c.v) ? c.v.map((x, i) => ({ v: x, from: [...c.from, i] })) : []))
          : cur.map((c) => ({ v: c.v == null ? undefined : c.v[k], from: c.from })).filter((c) => c.v !== undefined);
      }
      return cur;
    }
    /** the real path of a fanned-out row: each `*` replaced by the index it came through */
    const realPath = (path, from) => { let j = 0; return path.map((k) => (k === "*" ? from[j++] : k)); };
    /** a short name for a parent row: its first string field */
    const labelOf = (o) => (isObj(o) ? Object.values(o).find((x) => typeof x === "string" && x) || "" : "");

    let st = {};
    const B = () => (st.deep ? DEEP : BODY);
    const q = document.querySelector("[data-q]");
    const table = document.querySelector("[data-table]");
    const key = (p) => JSON.stringify(p);

    function cell(v, rowPath, k2) {
      const k = kind(v);
      if (k === "object" || k === "array") {
        const p = [...rowPath, k2];
        const n = k === "array" ? v.length : Object.keys(v).length;
        const [a, b] = k === "array" ? ["[", "]"] : ["{", "}"];
        const open = st.open.includes(key(p));
        // a peek of what's inside: plain values as they are, objects by their first string field
        const peekVals = k === "array" ? v.map((x) => (typeof x !== "object" ? x : labelOf(x))).filter((x) => x !== "") : [];
        const peek = !open && peekVals.length ? `<span class="peek">${mark(esc(peekVals.join(", ")))}</span>` : "";
        return `<td><button type="button" class="jt-nest" aria-expanded="${open}" data-open='${esc(key(p))}' title="${open ? "Close" : "Show"} ${k === "array" ? `${n} items` : `${n} fields`}"><span class="br">${a}</span>${n}<span class="br">${b}</span></button>${peek}</td>`;
      }
      if (k === "null") return `<td class="null">null</td>`;
      if (k === "string") return v === "" ? `<td class="empty-str">""</td>` : `<td class="str" title="${esc(v)}">${mark(esc(v))}</td>`;
      if (k === "number") return `<td class="num">${mark(esc(v))}</td>`;
      if (k === "boolean") return `<td class="bool">${v}</td>`;
      return `<td></td>`;
    }
    const mark = (html) => {
      if (!st.search) return html;
      const re = new RegExp(st.search.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      return html.replace(re, (m) => `<mark class="hit">${m}</mark>`);
    };
    const th = (name, num, sortable = true) => {
      if (!sortable) return `<th class="${num ? "num" : ""}"><span class="th">${esc(name)}</span></th>`;
      const s = st.sort && st.sort.col === name ? st.sort.dir : null;
      const icon = s === "asc" ? "sort-up" : "sort-down";
      return `<th class="${num ? "num" : ""}"${s ? ` aria-sort="${s === "asc" ? "ascending" : "descending"}"` : ""}><button type="button" data-sort="${esc(name)}" title="Sort by ${esc(name)}">${esc(name)}${ico(icon)}</button></th>`;
    };

    /** the opened nested values of one row, each as a table in a row of its own under it */
    function subRows(obj, rowPath, span) {
      if (!isObj(obj)) return "";
      return Object.entries(obj).filter(([k, v]) => v && typeof v === "object" && st.open.includes(key([...rowPath, k]))).map(([k, v]) => {
        const p = [...rowPath, k];
        const n = Array.isArray(v) ? `${v.length} ${v.length === 1 ? "row" : "rows"}` : `${Object.keys(v).length} fields`;
        return `<tr class="jt-sub"><td class="ix"></td><td colspan="${span}"><div class="jt-subwrap">
          <div class="jt-subhead"><code>${esc(k)}</code><span>${n}</span><button type="button" class="btn btn--quiet" data-go='${esc(key(p))}'>${ico("table-2")}Open as table</button></div>
          <table class="jt">${tableHTML(v, p, false).inner}</table></div></td></tr>`;
      }).join("");
    }

    /** an object as Field | Value, an array as one row per item; nested tables open under their row */
    function tableHTML(value, path, top, fanned) {
      if (isObj(value)) {
        const rows = Object.entries(value).filter(([k, v]) => !st.search || JSON.stringify([k, v]).toLowerCase().includes(st.search.toLowerCase()));
        const body = rows.map(([k, v]) => `<tr><td class="key">${mark(esc(k))}</td>${cell(v, path, k)}</tr>${v && typeof v === "object" && st.open.includes(key([...path, k])) ? subRows({ [k]: v }, path, 1).replace('<td class="ix"></td>', "") : ""}`).join("");
        return { inner: `<thead><tr>${th("Field", false, false)}${th("Value", false, false)}</tr></thead><tbody>${body}</tbody>`, count: `${Object.keys(value).length} fields`, total: rows.length };
      }
      let rows = fanned || value.map((v, i) => ({ i, v, p: [...path, i] }));
      const all = rows.length;
      const scalar = rows.some((r) => !isObj(r.v));
      const cols = scalar ? ["value"] : [...new Set(rows.flatMap((r) => Object.keys(r.v)))];
      const numCol = (c) => rows.every((r) => !(c in r.v) || r.v[c] === null || typeof r.v[c] === "number");
      if (top && st.search) { const n = st.search.toLowerCase(); rows = rows.filter((r) => JSON.stringify(r.v).toLowerCase().includes(n)); }
      if (top && st.sort) {
        const { col, dir } = st.sort, s = dir === "asc" ? 1 : -1;
        rows = [...rows].sort((a, b) => {
          const x = a.v[col], y = b.v[col];
          if (x == null) return 1; if (y == null) return -1;
          return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * s;
        });
      }
      // fanned-out rows lead with where they came from: the parent's index and name
      const parent = fanned ? path[path.lastIndexOf("*") - 1] : null;
      const head = `<tr><th class="ix">#</th>${fanned ? `<th><span class="th">${esc(parent)}</span></th>` : ""}${cols.map((c) => th(c, numCol(c), top)).join("")}</tr>`;
      const body = rows.map((r) => {
        const from = fanned ? `<td class="from" title="${esc(jp(r.p.slice(0, -2)))}">[${r.from.join("][")}]${r.label ? ` <span>${esc(r.label)}</span>` : ""}</td>` : "";
        const tds = scalar ? cell(r.v, path, r.i) : cols.map((c) => (c in r.v ? cell(r.v[c], r.p, c) : "<td></td>")).join("");
        return `<tr><td class="ix">${r.i}</td>${from}${tds}</tr>${scalar ? "" : subRows(r.v, r.p, cols.length + (fanned ? 1 : 0))}`;
      }).join("");
      return { inner: `<thead>${head}</thead><tbody>${body}</tbody>`, count: `${all} rows · ${cols.length} columns`, total: rows.length, all };
    }

    function render() {
      const trail = document.querySelector("[data-trail]");
      const count = document.querySelector("[data-count]");
      const status = document.querySelector("[data-status]");
      const isPath = (st.q || "").trimStart().startsWith("$");
      st.search = !isPath && st.q ? st.q : "";
      document.querySelector("[data-rf-icon]").innerHTML = ico(isPath ? "filter" : "search");
      q.classList.toggle("is-path", isPath);
      document.querySelector("[data-kbd]").hidden = !!st.q;
      document.querySelector("[data-clear]").hidden = !st.q;

      // ---- where the rows come from
      let value, fanned = null, filtered = false;
      status.textContent = "";
      if (isPath) {
        // the preview only knows this one filter; the app runs the real JSONPath engine
        value = BODY.data.filter((r) => r.balance > 0).map((r) => ({ ...r }));
        filtered = true;
        status.textContent = `${value.length} results`;
      } else if (st.path.includes("*")) {
        // `$.data[*].hobbies`: every hobby of every row, in one table
        const lists = rowsAt(B(), st.path);
        fanned = lists.flatMap((c) => (Array.isArray(c.v) ? c.v : [c.v]).map((v) => ({ v, from: c.from, label: labelOf(at(B(), realPath(st.path, c.from).slice(0, st.path.lastIndexOf("*") + 1))) })))
          .map((r, i) => ({ ...r, i, p: [...realPath(st.path, r.from), i] }));
        // a fanned row's real index is its index inside its own parent list
        const seen = {};
        fanned.forEach((r) => { const k = key(r.from); seen[k] = (seen[k] ?? -1) + 1; r.p = [...realPath(st.path, r.from), seen[k]]; });
        value = fanned.map((r) => r.v);
      } else {
        value = at(B(), st.path);
      }
      const segs = st.path.map((k, i) => {
        const last = i === st.path.length - 1, text = esc(crumb(k));
        return last || k === "*" || st.path[i + 1] === "*" && !last && false ? `<span${last ? ' aria-current="location"' : ""}>${text}</span>` : `<button type="button" data-go='${esc(key(st.path.slice(0, i + 1)))}'>${text}</button>`;
      });
      trail.innerHTML = filtered
        ? `<span aria-current="location">${ico("filter")} JSONPath result</span>`
        : [st.path.length ? `<button type="button" data-go="[]">$</button>` : `<span aria-current="location">$</span>`, ...segs].join(ico("chevron-right")) +
          `<button type="button" class="icon-btn" title="Pick rows from…" aria-label="Pick rows from" aria-haspopup="menu" aria-expanded="${!!st.menu}" data-menu>${ico("chevron-down")}</button>`;

      const pick = document.querySelector("[data-pick]");
      pick.hidden = !st.menu;
      pick.innerHTML = candidates(B()).map((c) => {
        const on = key(c.path) === key(st.path);
        return `<button type="button" role="menuitemradio" aria-checked="${on}" data-go='${esc(key(c.path))}'>${on ? ico("check").replace('class="ico"', 'class="ico ok"') : '<span class="slot"></span>'}<code>${esc(jp(c.path))}</code><span class="what">${c.what}</span></button>`;
      }).join("");

      const t = tableHTML(value, st.path, true, fanned);
      table.innerHTML = t.inner;
      count.textContent = filtered ? "" : t.count;
      if (st.search && !isObj(value)) status.textContent = t.total ? `${t.total} of ${t.all} rows` : "No matches";
    }

    // clicks: drill into a chip, walk back on the trail, pick rows, sort a column
    document.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) { const k = open.dataset.open; st.open = st.open.includes(k) ? st.open.filter((x) => x !== k) : [...st.open, k]; render(); return; }
      const go = e.target.closest("[data-go]");
      if (go) { st.path = JSON.parse(go.dataset.go); st.sort = null; st.menu = false; st.open = []; render(); return; }
      if (e.target.closest("[data-menu]")) { st.menu = !st.menu; render(); return; }
      const so = e.target.closest("[data-sort]");
      if (so) {
        const col = so.dataset.sort, cur = st.sort && st.sort.col === col ? st.sort.dir : null;
        st.sort = cur === null ? { col, dir: "asc" } : cur === "asc" ? { col, dir: "desc" } : null;
        render(); return;
      }
      if (st.menu && !e.target.closest(".jt-pick-menu, [data-show]")) { st.menu = false; render(); }
    });
    q.addEventListener("input", () => { st.q = q.value; render(); });
    document.querySelector("[data-clear]").addEventListener("click", () => { st.q = q.value = ""; render(); });
    document.querySelector("[data-wrap]").addEventListener("click", (e) => {
      const b = e.currentTarget, on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on)); table.classList.toggle("wrap", on);
    });

    // the XML body for the "not JSON" screen, in the code view's line format
    document.querySelector("[data-xml]").innerHTML = XML.split("\n").map((l) => `<span class="l">${esc(l)}</span>`).join("");

    // screens: one at a time, kept in the URL hash; an element can belong to several screens
    const req = { url: document.querySelector('.url-field input[aria-label="URL"]') };
    const go = (s) => {
      if (!SCREENS[s]) s = "table";
      document.querySelectorAll("[data-screen]").forEach((el) => { el.hidden = !el.dataset.screen.split(" ").includes(s); });
      document.querySelectorAll("[data-show]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.show === s)));
      st = { open: [], ...JSON.parse(JSON.stringify(SCREENS[s])) };
      q.value = st.q || "";
      // the request above follows the screen
      req.url.value = s === "notjson" ? "{{baseUrl}}/v1/customers.xml?limit=1" : "{{baseUrl}}/v1/customers?limit=6";
      req.url.dispatchEvent(new Event("input"));
      if (s !== "notjson") render();
      try { history.replaceState(null, "", `#${s}`); } catch { /* file:// in some browsers */ }
    };
    document.querySelectorAll("[data-show]").forEach((b) => b.addEventListener("click", () => go(b.dataset.show)));
    go(location.hash.slice(1) || "table");
  }
</script>
