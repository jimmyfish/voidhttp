  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const tpls = [...document.querySelectorAll("template[data-modal]")];
  const statesOf = (k) => tpls.filter((t) => t.dataset.modal === k);

  // rail: kinds with their states, then the call sites, then what lives outside the slot
  const kindList = $("#mv-kinds");
  for (const k of KINDS) {
    const states = statesOf(k.kind);
    const btn = el("button", { type: "button", className: "mv-kind" }, [el("code", { textContent: k.kind }), el("small", { textContent: k.shell ? k.comp + ", on Shell" : k.comp })]);
    btn.dataset.kind = k.kind;
    btn.addEventListener("click", () => go(k.kind + ":" + (states[0]?.dataset.state ?? "")));
    const row = el("li", {}, [btn]);
    if (states.length > 1) {
      const wrap = el("div", { className: "mv-states" });
      wrap.dataset.for = k.kind;
      for (const t of states) {
        const s = el("button", { type: "button", className: "mv-state", textContent: t.dataset.title });
        s.dataset.go = k.kind + ":" + t.dataset.state;
        s.addEventListener("click", () => go(s.dataset.go));
        wrap.append(s);
      }
      row.append(wrap);
    }
    kindList.append(row);
  }
  for (const [title, at, target] of CALLS) {
    const b = el("button", { type: "button", className: "mv-call" }, [el("span", { textContent: title }), el("small", { textContent: at })]);
    b.dataset.go = target;
    b.addEventListener("click", () => go(target));
    $("#mv-calls").append(el("li", {}, [b]));
  }
  for (const [title, at] of OUTSIDE) $("#mv-outside").append(el("li", { className: "mv-static" }, [el("span", { textContent: title }), el("small", { textContent: at })]));

  function go(id) {
    const [kind, state] = id.split(":");
    const k = KINDS.find((x) => x.kind === kind) ?? KINDS[0];
    const t = statesOf(k.kind).find((x) => x.dataset.state === state) ?? statesOf(k.kind)[0];
    const canvas = $("#mv-canvas");
    canvas.replaceChildren();
    if (t) {
      canvas.append(t.content.cloneNode(true));
      if (mode === "proposed" && k.shell) propose(canvas, k.kind, t.dataset.state);
      canvas.querySelectorAll("a[href]").forEach((a) => a.addEventListener("click", (e) => e.preventDefault()));
      canvas.querySelectorAll("form").forEach((f) => f.addEventListener("submit", (e) => e.preventDefault()));
    } else {
      canvas.append(el("p", { className: "pv-muted", textContent: "No drawing for this kind yet." }));
    }
    const cur = k.kind + ":" + (t?.dataset.state ?? "");
    document.querySelectorAll(".mv-kind").forEach((b) => b.setAttribute("aria-current", String(b.dataset.kind === k.kind)));
    document.querySelectorAll(".mv-states").forEach((w) => { w.hidden = w.dataset.for !== k.kind; });
    document.querySelectorAll(".mv-state").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.go === cur)));
    document.querySelectorAll(".mv-call").forEach((b) => b.setAttribute("aria-current", String(b.dataset.go === cur && b === document.activeElement)));
    facts(k, t);
    canvas.dataset.mode = mode;
    history.replaceState(null, "", "#" + cur);
  }

  function facts(k, t) {
    const f = $("#mv-facts");
    const list = (rows) => el("ul", {}, rows.map(([label, at]) => el("li", {}, [el("span", { textContent: label }), el("code", { textContent: at })])));
    const keys = k.keys ? [el("p", {}, ["Shortcut ", ...k.keys.split(" / ").flatMap((x, i) => (i ? [" or ", el("kbd", { textContent: x })] : [el("kbd", { textContent: x })]))])] : [];
    f.replaceChildren(
      el("div", {}, [el("h3", { textContent: "Component" }), el("p", {}, [el("code", { textContent: k.comp })]), el("p", {}, [el("code", { textContent: k.at })]), ...keys]),
      el("div", {}, [el("h3", { textContent: "Payload" }), el("p", {}, [el("code", { textContent: `{ kind: "${k.kind}"${k.payload === "none" ? "" : ", " + k.payload} }` })]), ...(t ? [el("p", { className: "pv-muted", textContent: "Showing: " + t.dataset.title })] : [])]),
      el("div", {}, [el("h3", { textContent: `Opened from (${k.from.length})` }), list(k.from)]),
    );
  }

  // Proposed Shell: a header that says what the dialog does (icon tile, title, one line of context), a softer raised surface,
  // the action named on its button. The prompt shows where the new item lands, live, and refuses a name already there.
  // Done in the page, on the shipped markup, so every Shell modal shows what one Shell change would do to it.
  let mode = new URLSearchParams(location.search).get("shell") === "proposed" ? "proposed" : "today";
  const svg = (n, cls = "ico") => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", cls); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#i-" + n); s.append(u); return s; };
  const path = (parts) => parts.flatMap((x, i) => (i ? [el("span", { className: "sep", textContent: "/" }), el("b", { textContent: x })] : [el("b", { textContent: x })]));

  /** tone: create (accent), danger (error), plain (neutral) */
  const HEAD = {
    "prompt:new-collection": { icon: "library-big", tone: "create", sub: ["In project", ["Shopfront"]], verb: ["Create collection", "plus"] },
    "prompt:new-folder": { icon: "folder-plus", tone: "create", sub: ["In", ["orders-api"]], verb: ["Create folder", "plus"] },
    "confirm:delete-project": { icon: "trash-2", tone: "danger", verb: [null, "trash-2"] },
    "confirm:clear-history": { icon: "history", tone: "danger", verb: [null, "trash-2"] },
    "confirm:delete-request": { icon: "trash-2", tone: "danger", verb: [null, "trash-2"] },
    "save:default": { icon: "bookmark-plus", tone: "create", sub: ["POST", ["Create order"]], verb: [null, "check"] },
    "project:new": { tile: true, sub: ["Collections, environments and history of its own", []], verb: ["Create project", "plus"] },
    "project:edit": { tile: true, sub: ["Shopfront", []], verb: [null, "check"] },
    "environments:env": { icon: "braces", tone: "plain", sub: ["Shopfront", []] },
    "environments:collection": { icon: "braces", tone: "plain", sub: ["Shopfront", []] },
    settings: { icon: "settings", tone: "plain", sub: ["Applies to every project", []] },
  };

  /** what the prompt's preview tree holds: the parent, its children, where the new row goes */
  const TREE = {
    "new-collection": { kind: "collection", parent: null, siblings: ["orders-api", "auth-service"], ph: "payments-service" },
    "new-folder": { kind: "folder", parent: "orders-api", siblings: ["orders", "refunds"], requests: [["POST", "Ping"]], ph: "Refunds" },
  };

  function previewTree(t, input, submit, err) {
    const box = el("div", { className: "sh-tree", ariaHidden: "true" });
    const row = (cls, indent, kids) => { const r = el("div", { className: "row " + cls }); r.style.setProperty("--indent", indent + "px"); r.append(el("div", { className: "row-main" }, kids)); return r; };
    const caret = (open) => svg(open ? "chevron-down" : "chevron-right", "ico caret");
    let indent = 0;
    if (t.parent) { box.append(row("collection", 0, [caret(true), el("span", { className: "name", textContent: t.parent })])); indent = 16; }
    const ghost = row("sh-ghost" + (t.kind === "collection" ? " collection" : ""), indent, [caret(false), ...(t.kind === "folder" ? [svg("folder", "ico folder")] : []), el("span", { className: "name" })]);
    const sibs = t.siblings.map((n) => row("sh-sib" + (t.kind === "collection" ? " collection" : ""), indent, [caret(false), ...(t.kind === "folder" ? [svg("folder", "ico folder")] : []), el("span", { className: "name", textContent: n }), el("span", { className: "sh-tag", textContent: "Already here" })]));
    box.append(ghost, ...sibs, ...(t.requests ?? []).map(([m, n]) => row("sh-sib", indent + 24, [el("span", { className: "m m-" + m, textContent: m }), el("span", { className: "name", textContent: n })])));
    const sync = () => {
      const v = input.value.trim();
      const name = ghost.querySelector(".name");
      name.textContent = v || t.ph;
      ghost.classList.toggle("is-empty", !v);
      const dupe = sibs.find((s) => s.querySelector(".name").textContent.toLowerCase() === v.toLowerCase());
      sibs.forEach((s) => s.classList.toggle("sh-dupe", s === dupe));
      ghost.classList.toggle("is-dupe", !!dupe);
      input.toggleAttribute("aria-invalid", !!dupe);
      err.hidden = !dupe;
      if (dupe) err.lastChild.textContent = `${t.parent ?? "Shopfront"} already has ${t.kind === "folder" ? "a folder" : "a collection"} named ${dupe.querySelector(".name").textContent}.`;
      submit.disabled = !v || !!dupe;
    };
    input.addEventListener("input", sync);
    sync();
    return box;
  }

  function propose(root, kind, state) {
    const d = root.querySelector(".dialog");
    if (!d) return;
    const cfg = HEAD[kind + ":" + state] ?? HEAD[kind] ?? {};
    d.classList.add("sh");
    root.querySelector(".backdrop")?.classList.add("sh-backdrop");

    // header: tile, title over its context, close
    const h3 = d.querySelector(":scope > h3");
    const tile = cfg.tile ? d.querySelector(".proj-preview .proj-tile") : el("span", { className: "sh-tile sh-tile--" + (cfg.tone ?? "plain") }, [svg(cfg.icon ?? "square")]);
    if (cfg.tile) { tile.classList.add("sh-tile"); }
    const text = el("div", { className: "sh-title" }, [h3]);
    const msg = kind === "confirm" ? d.querySelector(":scope > p") : null;
    if (msg) { msg.className = "sh-sub"; text.append(msg); }
    else if (cfg.sub) {
      const [lead, parts] = cfg.sub;
      const sub = el("p", { className: "sh-sub" }, [lead]);
      if (parts.length) { sub.append(" ", ...path(parts)); }
      if (kind === "save") { sub.replaceChildren(el("span", { className: "m m-POST", textContent: "POST" }), " ", el("b", { textContent: "Create order" })); }
      text.append(sub);
    }
    const head = el("div", { className: "sh-head" }, [tile, text, el("button", { type: "button", className: "icon-btn sh-close", ariaLabel: "Close" }, [svg("x")])]);
    d.prepend(head);
    d.querySelector(".proj-preview")?.remove();

    // body and footer
    const box = d.querySelector(":scope > form") ?? d;
    const foot = box.querySelector(":scope > footer");
    const body = el("div", { className: "sh-body" });
    [...box.children].filter((n) => n !== head && n !== foot).forEach((n) => body.append(n));
    box.insertBefore(body, foot ?? null);
    if (!body.childElementCount) body.remove();
    if (foot && kind === "settings") { foot.remove(); body.classList.add("sh-body--end"); }
    else if (foot) {
      const f = el("div", { className: "sh-foot" }); f.append(...foot.childNodes); foot.replaceWith(f);
      f.querySelectorAll(".btn:not(.btn--primary):not(.btn--danger)").forEach((b) => b.classList.add("btn--quiet"));
      const main = f.querySelector(".btn--primary, .btn--danger");
      if (main && cfg.verb) {
        const [label, ic] = cfg.verb;
        if (label) main.textContent = label;
        if (ic) main.prepend(svg(ic));
        if (main.classList.contains("btn--danger")) main.classList.add("sh-danger");
      }
    }

    // the prompt: a big name field, then the tree it lands in
    if (kind === "prompt" && TREE[state]) {
      const t = TREE[state], input = body.querySelector("input");
      input.id = "sh-name"; input.removeAttribute("aria-label"); input.classList.add("sh-input");
      const label = el("label", { className: "sh-label", htmlFor: "sh-name", textContent: "Name" });
      const wrap = el("div", { className: "sh-field" }, [svg(t.kind === "folder" ? "folder" : "library-big"), input]);
      const err = el("p", { className: "sh-err", hidden: true }, [svg("circle-alert"), el("span")]);
      err.id = "sh-err"; input.setAttribute("aria-describedby", "sh-err");
      body.prepend(label, wrap, err);
      body.append(previewTree(t, input, d.querySelector(".btn--primary"), err));
      requestAnimationFrame(() => { input.focus(); input.select(); });
    }
  }
  const setMode = (m) => {
    mode = m;
    document.querySelectorAll("[data-shell-set]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.shellSet === m)));
    const u = new URL(location.href); if (m === "proposed") u.searchParams.set("shell", "proposed"); else u.searchParams.delete("shell");
    history.replaceState(null, "", u);
    go(decodeURIComponent(location.hash.slice(1)) || "prompt:new-collection");
  };
  document.querySelectorAll("[data-shell-set]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.shellSet)));

  // light / dark: tokens.css reads data-theme on <html>
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => {
    document.documentElement.dataset.theme = b.dataset.themeSet;
    document.querySelectorAll("[data-theme-set]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
  if (new URLSearchParams(location.search).get("theme") === "dark") $('[data-theme-set="dark"]').click();

  setMode(mode);
</script>
<!-- icons used by the proposed Shell: #i-x #i-folder #i-library-big #i-folder-plus #i-trash-2 #i-history #i-bookmark-plus #i-braces #i-settings #i-circle-alert #i-check #i-plus #i-square #i-chevron-down #i-chevron-right -->
</body>
</html>
