name: Feature request
description: Suggest a feature or a change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the "Not yet" list in the README and the open issues first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A sketch or a screenshot from another tool helps for UI changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways to solve it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
