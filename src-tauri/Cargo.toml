[package]
name = "voidhttp"
version = "0.1.0"
description = "voidHTTP — a lightweight API client"
edition = "2021"

[lib]
name = "voidhttp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Self-update from GitHub releases (latest.json, minisign-verified) and relaunch after.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Opens release pages in the default browser.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "gzip",
  "brotli",
  "deflate",
  "zstd",
  "multipart",
  "cookies",
  "stream",
] }
tokio = { version = "1", features = ["fs", "sync", "time", "macros"] }
tokio-util = "0.7"
base64 = "0.22"
mime_guess = "2"
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
# gRPC: tonic for the HTTP/2 call, prost-reflect for messages built at runtime from a schema,
# protox to compile .proto files without protoc, tonic-reflection for the reflection client.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tokio-stream = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http2", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
http = "1"
tower = "0.5"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
